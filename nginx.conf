server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URL space. An unknown path is a client route,
    # not a 404 — hand it index.html and let the router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset filenames are content-hashed, so they can cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users keep loading the old bundle
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The same-origin seam. This replaces the Vite dev proxy, which only exists
    # while `npm run dev` is running. Without it the SPA and the API sit on
    # different origins, the SameSite=Strict auth cookies stop being
    # first-party, and every authenticated request fails.
    #
    # The backend's context path is already /api, so the prefix passes through
    # intact — no trailing slash on proxy_pass.
    location /api/ {
        # Docker's embedded DNS. Without an explicit resolver nginx looks the
        # upstream up once at startup and caches it forever — a backend restart
        # gets a new container IP and every request 502s until nginx is
        # restarted too. A variable in proxy_pass forces re-resolution, and
        # then the URI has to be passed on explicitly.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://backend:8100;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The AI assistant streams its reply token by token; buffering would
        # hold the whole response until the model finishes.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
